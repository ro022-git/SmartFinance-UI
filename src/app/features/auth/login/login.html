<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Login</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" formControlName="username">
            <div *ngIf="submitted && f['username'].errors" class="text-danger mt-1">
              Username is required
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password">
            <div *ngIf="submitted && f['password'].errors" class="text-danger mt-1">
              Password is required
            </div>
          </div>

          <div *ngIf="error" class="alert alert-danger">
            {{ error }}
            <small *ngIf="errorDetails" class="d-block mt-2 text-muted">
              Details: {{ errorDetails }}
            </small>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Login</button>
            <button type="button" class="btn btn-secondary" routerLink="/register">Register</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
