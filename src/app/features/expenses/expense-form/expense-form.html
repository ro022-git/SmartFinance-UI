<div class="expense-form-container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="form-card">
        <div class="form-card-header">
          <h2>{{ isEditMode ? 'Edit' : 'Add' }} Expense</h2>
        </div>
        <div class="form-card-body">
          
          <div *ngIf="loading" class="text-center py-5">
            <div class="custom-spinner"></div>
            <p class="mt-3">Loading expense...</p>
          </div>

          <form *ngIf="!loading" [formGroup]="expenseForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label class="form-label">
                Description <span class="text-danger">*</span>
              </label>
              <input 
                type="text" 
                class="form-control" 
                formControlName="description"
                placeholder="e.g., Groceries, Rent, Electricity">
              <div *ngIf="submitted && f['description'].errors" class="text-danger mt-1">
                <div *ngIf="f['description'].errors['required']">Description is required</div>
                <div *ngIf="f['description'].errors['minlength']">Minimum 3 characters required</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Amount (₹) <span class="text-danger">*</span>
              </label>
              <input 
                type="number" 
                step="0.01" 
                class="form-control" 
                formControlName="amount"
                placeholder="0.00">
              <div *ngIf="submitted && f['amount'].errors" class="text-danger mt-1">
                <div *ngIf="f['amount'].errors['required']">Amount is required</div>
                <div *ngIf="f['amount'].errors['min']">Amount must be greater than 0</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Date <span class="text-danger">*</span>
              </label>
              <input 
                type="date" 
                class="form-control" 
                formControlName="date">
              <div *ngIf="submitted && f['date'].errors" class="text-danger mt-1">
                Date is required
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Category <span class="text-danger">*</span>
              </label>
              <select class="form-control" formControlName="categoryId">
                <option value="">Select Category</option>
                <option *ngFor="let cat of categories" [value]="cat.id">
                  {{ cat.name }}
                </option>
              </select>
              <div *ngIf="submitted && f['categoryId'].errors" class="text-danger mt-1">
                Category is required
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Link to Loan (Optional)
              </label>
              <select class="form-control" formControlName="loanId">
                <option [value]="null">Not a loan payment</option>
                <option *ngFor="let loan of loans" [value]="loan.id">
                  {{ loan.lenderName }} - ₹{{ loan.remainingAmount }} remaining
                </option>
              </select>
              <small class="text-muted">
                If this expense is a loan payment, select the loan
              </small>
            </div>

            <div *ngIf="success" class="alert alert-success">
              {{ success }}
            </div>
            <div *ngIf="error" class="alert alert-danger">
              {{ error }}
            </div>

            <div class="d-flex gap-2">
              <button 
                type="submit" 
                class="btn btn-danger" 
                [disabled]="submitting"
                style="flex: 1;">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                {{ isEditMode ? 'Update Expense' : 'Save Expense' }}
              </button>
              <button 
                type="button" 
                class="btn btn-secondary" 
                routerLink="/expenses">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
