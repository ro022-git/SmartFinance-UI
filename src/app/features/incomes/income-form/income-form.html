<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">{{ isEditMode ? 'Edit' : 'Add' }} Income</h4>
        </div>
        <div class="card-body">

          <div *ngIf="loading" class="text-center py-4">
            <div class="spinner-border text-success" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <form *ngIf="!loading" [formGroup]="incomeForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label class="form-label">Source <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="source" placeholder="e.g., Salary, Freelance">
              <div *ngIf="submitted && f['source'].errors" class="text-danger mt-1">
                <div *ngIf="f['source'].errors['required']">Source is required</div>
                <div *ngIf="f['source'].errors['minlength']">Minimum 2 characters required</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Amount (₹) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" class="form-control" formControlName="amount" placeholder="0.00">
              <div *ngIf="submitted && f['amount'].errors" class="text-danger mt-1">
                <div *ngIf="f['amount'].errors['required']">Amount is required</div>
                <div *ngIf="f['amount'].errors['min']">Amount must be greater than 0</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" formControlName="date">
              <div *ngIf="submitted && f['date'].errors" class="text-danger mt-1">
                Date is required
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select class="form-control" formControlName="categoryId">
                <option value="">Select Category</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
              </select>
              <div *ngIf="submitted && f['categoryId'].errors" class="text-danger mt-1">
                Category is required
              </div>
            </div>

            <div *ngIf="success" class="alert alert-success">{{ success }}</div>
            <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success" [disabled]="submitting">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                {{ isEditMode ? 'Update Income' : 'Save Income' }}
              </button>
              <button type="button" class="btn btn-secondary" routerLink="/incomes">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
